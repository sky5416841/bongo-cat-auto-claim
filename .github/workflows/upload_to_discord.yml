name: 🚀 自動推送實體檔案到 Discord

on:
  push:
    branches: [main]
    paths:
      - '**.dll'
      - '**.pdb'
  workflow_dispatch:

jobs:
  upload-files:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載最新程式碼
        uses: actions/checkout@v4

      - name: 📂 還原訊息 ID 快取
        uses: actions/cache/restore@v4
        with:
          path: .msg_ids
          key: discord-msg-ids

      - name: 🗑️ 刪除舊的檔案訊息
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -f .msg_ids/file_msg_id ]; then
            OLD_ID=$(cat .msg_ids/file_msg_id)
            curl -s -X DELETE "${DISCORD_WEBHOOK}/messages/${OLD_ID}"
          fi

      - name: 📤 上傳最新檔案到 bongocat自動領取
        id: send_file
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          RESPONSE=$(curl -s -X POST "${DISCORD_WEBHOOK}?wait=true" \
            -F "payload_json={\"content\":\"📦 **Bongo Cat 最新版自動領取腳本來囉！**\n直接點擊下方檔案下載覆蓋即可 👇\"}" \
            -F "file1=@Assembly-CSharp.dll" \
            -F "file2=@Assembly-CSharp.pdb")
          echo "msg_id=$(echo "$RESPONSE" | jq -r '.id')" >> $GITHUB_OUTPUT

      - name: 🗑️ 刪除舊的更新資訊訊息
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
        run: |
          if [ -f .msg_ids/news_msg_id ]; then
            OLD_ID=$(cat .msg_ids/news_msg_id)
            curl -s -X DELETE "${DISCORD_WEBHOOK_NEWS}/messages/${OLD_ID}"
          fi

      - name: 📢 發送更新資訊
        id: send_news
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
        run: |
          DATE=$(TZ='Asia/Taipei' date '+%Y/%m/%d')
          RESPONSE=$(curl -s -X POST "${DISCORD_WEBHOOK_NEWS}?wait=true" \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"<@&1509832066123173950>\",
              \"allowed_mentions\": {\"roles\": [\"1509832066123173950\"]},
              \"embeds\": [{
                \"title\": \"✅ Bongo Cat 自動領取 已更新完成！\",
                \"description\": \"📅 **更新日期：${DATE}**\n\n已推送最新版本，請至 bongocat自動領取 頻道下載最新 DLL 覆蓋舊版本。\",
                \"color\": 15548997,
                \"footer\": {\"text\": \"狐狸先生的小木屋 · 自動更新通知\"}
              }]
            }")
          echo "msg_id=$(echo "$RESPONSE" | jq -r '.id')" >> $GITHUB_OUTPUT

      - name: 💾 儲存訊息 ID 到快取
        run: |
          mkdir -p .msg_ids
          echo "${{ steps.send_file.outputs.msg_id }}" > .msg_ids/file_msg_id
          echo "${{ steps.send_news.outputs.msg_id }}" > .msg_ids/news_msg_id

      - name: 🗄️ 更新快取
        uses: actions/cache/save@v4
        with:
          path: .msg_ids
          key: discord-msg-ids
